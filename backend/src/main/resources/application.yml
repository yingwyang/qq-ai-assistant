spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qq_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:***REMOVED***}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0

server:
  port: ${SERVER_PORT:8081}

# AstrBot配置
astrbot:
  api-url: ${ASTRBOT_API_URL:http://localhost:6185}
  token: ${ASTRBOT_TOKEN:abk_6CJKaVnl8233_QVKJr_3ID1ns8cd5EIeCtSv31YjV84}
  data-path: ${ASTRBOT_DATA_PATH:D:/ai/Documents/qq-web/Astrbot/data}

# NapCat配置
napcat:
  api-url: ${NAPCAT_API_URL:http://localhost:6099}
  token: ${NAPCAT_TOKEN:***REMOVED***}
  webhook-token: ${NAPCAT_WEBHOOK_TOKEN:***REMOVED***}
  self-qq: ${NAPCAT_SELF_QQ:3649735451}

# GPT-SoVITS配置
gpt-sovits:
  api-url: ${GPT_SOVITS_API_URL:http://localhost:7860}
  token: ${GPT_SOVITS_TOKEN:your-gpt-sovits-token}

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:password123}
  bucket-name: ${MINIO_BUCKET:qq-chat-files}
  secure: false

# FFmpeg配置
ffmpeg:
  path: ${FFMPEG_PATH:D:/ai/Documents/qq-web/ffmpeg-8.1-essentials_build/bin/ffmpeg.exe}

# 文件上传配置
file:
  upload:
    max-size: 100MB
    allowed-types: image/*,video/*,audio/*,application/*
  storage:
    temp-path: ./uploads/temp
    archive-path: ./uploads/archive
    local-path: ./uploads/images

# 消息归档配置
archive:
  days-before: 90
  cron: 0 0 2 * * ?

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-qq-ai-assistant}
  expiration: ${JWT_EXPIRATION:86400000}
