spring:
  datasource:
    url: jdbc:h2:mem:qqai
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# AstrBot配置
astrbot:
  api-url: http://localhost:6185
  token: your-astrbot-token

# NapCat配置
napcat:
  api-url: http://localhost:6099
  token: ***REMOVED***

# GPT-SoVITS配置
gpt-sovits:
  api-url: http://localhost:7860
  token: your-gpt-sovits-token