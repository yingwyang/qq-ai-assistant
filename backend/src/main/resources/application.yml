spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qq_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 连接失败时启动失败（不静默降级，符合 spec 要求）
    listener:
      simple:
        # acknowledge-mode 默认 AUTO，配合自定义 ContainerFactory 的 RetryTemplate + defaultRequeueRejected=false
        # 实现失败重试 3 次后 reject(requeue=false) → 进死信队列
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# AstrBot配置
astrbot:
  api-url: ${ASTRBOT_API_URL:http://localhost:6185}
  token: ${ASTRBOT_TOKEN:}
  data-path: ${ASTRBOT_DATA_PATH:D:/ai/Documents/qq-web/Astrbot/data}

# NapCat配置
napcat:
  api-url: ${NAPCAT_API_URL:http://localhost:6100}
  onebot-api-url: ${NAPCAT_ONEBOT_API_URL:http://localhost:6100}
  webui-url: ${NAPCAT_WEBUI_URL:http://127.0.0.1:6099}
  token: ${NAPCAT_TOKEN:}
  webhook-token: ${NAPCAT_WEBHOOK_TOKEN:}
  self-qq: ${NAPCAT_SELF_QQ:2488130337}

# GPT-SoVITS配置
gpt-sovits:
  api-url: ${GPT_SOVITS_API_URL:http://localhost:8000}
  token: ${GPT_SOVITS_TOKEN:}
  ref-audio-path: ${GPT_SOVITS_REF_AUDIO_PATH:D:/ai/Documents/qq-web/GPT-SoVITS-v2pro-20250604-nvidia50/reference/ref_01.wav}
  prompt-text: ${GPT_SOVITS_PROMPT_TEXT:大家好，今天是个美好的日子。}
  prompt-lang: ${GPT_SOVITS_PROMPT_LANG:zh}
  text-lang: ${GPT_SOVITS_TEXT_LANG:zh}
  output-dir: ${GPT_SOVITS_OUTPUT_DIR:D:/ai/Documents/qq-web/qq-ai-assistant/backend/uploads/tts}
  # 训练好的音色模型根目录
  model-root: ${GPT_SOVITS_MODEL_ROOT:D:/ai/Documents/qq-web/GPT-SoVITS-v2pro-20250604-nvidia50}
  default-character: ${GPT_SOVITS_DEFAULT_CHARACTER:Kisaki}
  # 角色列表
  characters:
    - name: Kisaki
      label: Kisaki（妃那）
      gpt-path: GPT_weights_v2Pro/Kisaki-e15.ckpt
      sovits-path: SoVITS_weights_v2Pro/Kisaki_e8_s5104.pth
      ref-audio: reference/Kisaki_ref.wav
      prompt-text: どうして皆さんそこに物語性を求めるのでしょうか。
      prompt-lang: ja
    - name: 加藤惠
      label: 加藤惠
      gpt-path: GPT_weights_v2Pro/加藤惠-e15.ckpt
      sovits-path: SoVITS_weights_v2Pro/加藤惠_e8_s4144.pth
      ref-audio: reference/katou_ref.wav
      prompt-text: 別に泣き芸をバカにしてるわけじゃないよ。本当だよ。
      prompt-lang: ja

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:qq-chat-files}
  secure: false

# FFmpeg配置
ffmpeg:
  path: ${FFMPEG_PATH:D:/ai/Documents/qq-web/GPT-SoVITS-v2pro-20250604-nvidia50/runtime/ffmpeg.exe}

# Python 配置（用于 QQ SILK 语音解码）
python:
  executable: ${PYTHON_EXECUTABLE:C:/Users/46142/AppData/Roaming/uv/tools/astrbot/Scripts/python.exe}
  silk-script: ${PYTHON_SILK_SCRIPT:./scripts/convert_silk_to_mp3.py}

# 文件上传配置
file:
  upload:
    max-size: 100MB
    allowed-types: image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip
  # 媒体下载体积上限(从 QQ/NapCat 拉取媒体时生效)
  download:
    max-size-mb: ${FILE_DOWNLOAD_MAX_MB:100}
    max-video-size-mb: ${FILE_DOWNLOAD_MAX_VIDEO_MB:300}
  storage:
    temp-path: ./uploads/temp
    archive-path: ./uploads/archive
    local-path: ./uploads/images

# 消息归档配置
archive:
  days-before: 90
  cron: 0 0 2 * * ?

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 注册与账户安全配置
app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
    rate-limit-per-ip: 5
    rate-limit-window-minutes: 1
  cors:
    # 直接硬编码白名单，避免 ${ENV:default} 在某些情况下 default 值中的逗号被错误截断
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176
  admin:
    init-password: ${ADMIN_INIT_PASSWORD:}
  debug:
    # 媒体事件抓包开关:true 时打印图片/视频事件的完整载荷(含聊天内容),仅排查媒体链路时临时开启
    # 媒体链路排查手册见 doc/MEDIA_TROUBLESHOOTING.md
    log-media-payload: ${APP_DEBUG_LOG_MEDIA_PAYLOAD:false}

---
# Dev profile: 开发环境覆盖
# 启用: java -jar app.jar --spring.profiles.active=dev
# 或:   mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 开发环境直接指定（避免环境变量未设置时启动失败）
    url: jdbc:mysql://localhost:3306/qq_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

napcat:
  token: ${NAPCAT_TOKEN:}
  webhook-token: ${NAPCAT_WEBHOOK_TOKEN:}

minio:
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
