spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qq_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ***REMOVED***
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8081
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# AstrBot配置
astrbot:
  api-url: http://localhost:6185
  token: your-astrbot-token

# NapCat配置
napcat:
  api-url: http://localhost:6099
  token: ***REMOVED***
  webhook-token: ***REMOVED***
  self-qq: 3649735451  # 登录账号的QQ号，用于区分登录账号发送的消息

# GPT-SoVITS配置
gpt-sovits:
  api-url: http://localhost:7860
  token: your-gpt-sovits-token

# MinIO配置
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password123
  bucket-name: qq-chat-files
  secure: false

# 文件上传配置
file:
  upload:
    max-size: 100MB
    allowed-types: image/*,video/*,audio/*,application/*
  storage:
    # 本地临时存储路径
    temp-path: ./uploads/temp
    # 归档存储路径
    archive-path: ./uploads/archive
    # 本地图片存储路径
    local-path: ./uploads/images

# 消息归档配置
archive:
  # 多少天前的消息需要归档
  days-before: 90
  # 每天几点执行归档任务
  cron: 0 0 2 * * ?
