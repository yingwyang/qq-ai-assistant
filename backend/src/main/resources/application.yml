spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/qq_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 连接失败时启动失败（不静默降级，符合 spec 要求）
    listener:
      simple:
        # acknowledge-mode 默认 AUTO，配合自定义 ContainerFactory 的 RetryTemplate + defaultRequeueRejected=false
        # 实现失败重试 3 次后 reject(requeue=false) → 进死信队列
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# 可观测性：/actuator/health 探测 MySQL（db）与 RabbitMQ（rabbit）。
# 注意：该配置必须留在本文件第一个文档里 —— 文件后半段（`---` 之后）是 dev profile 文档，
# 写在那边只会在 --spring.profiles.active=dev 时生效（曾经踩过：端点只暴露了 health）。
# 端点的访问权限在 SecurityConfig 中收口为仅 ADMIN。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 详情含 db/rabbit 等组件状态；该端点仅管理员可访问，详情用于排障
      show-details: always
      probes:
        enabled: true

# AstrBot配置
astrbot:
  api-url: ${ASTRBOT_API_URL:http://127.0.0.1:6185}
  token: ${ASTRBOT_TOKEN:}
  data-path: ${ASTRBOT_DATA_PATH:D:/ai/Documents/qq-web/Astrbot/data}
  # 后台自动摘要使用的模型;留空 = 交给 AstrBot 用默认模型(不要硬编码模型名)
  summary-model: ${ASTRBOT_SUMMARY_MODEL:}
  # 带图请求(摘要/分析/聊天)使用的视觉配置文件;必须在 AstrBot 里存在同名配置文件,
  # 且其 Agent 模型具备图片识别能力(GLM-4.5V / Qwen-VL 等)。留空则不改配置文件。
  vision-config-name: ${ASTRBOT_VISION_CONFIG_NAME:vision}
  # 摘要/分析这类「抽取任务」专用的视觉配置文件:与上面同模型,但绑定的 AstrBot 人格
  # tools=[](不挂任何工具)。否则 Agent 管线会注入 send_message_to_user / future_task 等工具,
  # 模型跑去调用工具、回复"请稍等片刻",摘要正文变成工具调用文本。
  vision-task-config-name: ${ASTRBOT_VISION_TASK_CONFIG_NAME:vision-task}
  # 「双层提示词」的人层:用户在前端选 AstrBot 人格,后端按人格生成配置档案
  # (qqai-p-<slug>-text / -image)并绑定该人格的无工具副本。
  # 下面两项是生成档案时复制的「底座」档案:文本底座提供默认语言模型,
  # 视觉底座提供多模态模型(GL-4.5V 等)。改名后需与 AstrBot 里的档案名一致。
  persona-text-base-profile: ${ASTRBOT_PERSONA_TEXT_BASE:ray}
  persona-image-base-profile: ${ASTRBOT_PERSONA_IMAGE_BASE:vision}

# NapCat配置
napcat:
  api-url: ${NAPCAT_API_URL:http://127.0.0.1:6100}
  onebot-api-url: ${NAPCAT_ONEBOT_API_URL:http://127.0.0.1:6100}
  webui-url: ${NAPCAT_WEBUI_URL:http://127.0.0.1:6099}
  token: ${NAPCAT_TOKEN:}
  webhook-token: ${NAPCAT_WEBHOOK_TOKEN:}
  self-qq: ${NAPCAT_SELF_QQ:2488130337}

# GPT-SoVITS配置
gpt-sovits:
  api-url: ${GPT_SOVITS_API_URL:http://127.0.0.1:8000}
  token: ${GPT_SOVITS_TOKEN:}
  ref-audio-path: ${GPT_SOVITS_REF_AUDIO_PATH:D:/ai/Documents/qq-web/GPT-SoVITS-v5/reference/ref_01.wav}
  prompt-text: ${GPT_SOVITS_PROMPT_TEXT:大家好，今天是个美好的日子。}
  prompt-lang: ${GPT_SOVITS_PROMPT_LANG:zh}
  text-lang: ${GPT_SOVITS_TEXT_LANG:zh}
  output-dir: ${GPT_SOVITS_OUTPUT_DIR:D:/ai/Documents/qq-web/qq-ai-assistant/backend/uploads/tts}
  # 合成缓存：同一角色 + 同一文本只合成一次（按内容寻址存到该用户目录下）
  cache-enabled: ${GPT_SOVITS_CACHE_ENABLED:true}
  # 长文本分片：超过该字数才按句切分、逐段合成后拼接；<=0 关闭分片
  # 实测：单段超过约 120 字时，GPT-SoVITS 会提前结束、音频明显短于文本（Hazel 200 字只出 17.8s）
  chunk-max-chars: ${GPT_SOVITS_CHUNK_MAX_CHARS:120}
  # 合成语言按输入文本自动识别（含假名→ja，纯汉字→zh）；角色上的 text-lang 只作兜底
  auto-detect-text-lang: ${GPT_SOVITS_AUTO_DETECT_TEXT_LANG:true}
  # 并行推理：必须开启（实测关闭时合成立刻提前结束）
  parallel-infer: ${GPT_SOVITS_PARALLEL_INFER:true}
  # 分桶处理：默认关闭（实测开启时长文本会提前结束）
  split-bucket: ${GPT_SOVITS_SPLIT_BUCKET:false}
  # 分片之间的静音间隔（毫秒）
  fragment-interval-ms: ${GPT_SOVITS_FRAGMENT_INTERVAL_MS:120}
  # 安装目录（v2Pro / v5）；启动 GPT-SoVITS 时使用
  install-dir: ${GPT_SOVITS_INSTALL_DIR:D:/ai/Documents/qq-web/GPT-SoVITS-v5}
  # 启动时使用的推理配置（相对安装目录）；v5 必须显式指定，否则会用默认 v2 配置
  infer-config: ${GPT_SOVITS_INFER_CONFIG:GPT_SoVITS/configs/tts_infer_v5turbo.yaml}
  # 语速系数：v5turbo 原生模型语速偏慢需约 1.4；v2Pro 权重保持 1.0
  speed-factor: ${GPT_SOVITS_SPEED_FACTOR:1.0}
  # 音色权重根目录（角色权重与参考音频都在这里）
  model-root: ${GPT_SOVITS_MODEL_ROOT:D:/ai/Documents/qq-web/GPT-SoVITS-v5}
  default-character: ${GPT_SOVITS_DEFAULT_CHARACTER:Kisaki}
  # 角色列表
  characters:
    - name: Kisaki
      label: 妃
      gpt-path: GPT_weights_v2Pro/Kisaki-e15.ckpt
      sovits-path: SoVITS_weights_v2Pro/Kisaki_e8_s5104.pth
      ref-audio: reference/Kisaki_ref.wav
      prompt-text: どうして皆さんそこに物語性を求めるのでしょうか。
      prompt-lang: ja
      text-lang: ja
    - name: 加藤惠
      label: 加藤惠
      gpt-path: GPT_weights_v2Pro/加藤惠-e15.ckpt
      sovits-path: SoVITS_weights_v2Pro/加藤惠_e8_s4144.pth
      ref-audio: reference/katou_ref.wav
      prompt-text: 別に泣き芸をバカにしてるわけじゃないよ。本当だよ。
      prompt-lang: ja
      text-lang: ja
    - name: Eustia
      label: 尤斯蒂娅
      gpt-path: GPT_weights_v2Pro/eustia-e15.ckpt
      sovits-path: SoVITS_weights_v2Pro/eustia_e4_s5800.pth
      ref-audio: reference/Eustia_ref.wav
      prompt-text: 本名はユースティアと言うらしいのですが、よくわかりません。
      prompt-lang: ja
      text-lang: ja
    - name: Hazel
      label: 灰泽满
      gpt-path: GPT_weights_v2Pro/hazel-e12.ckpt
      sovits-path: SoVITS_weights_v2Pro/hazel_e6_s3306.pth
      ref-audio: reference/Hazel_ref.wav
      prompt-text: 肯定是暖的，怎么处理情感问题呢？
      prompt-lang: zh
      text-lang: zh
    - name: Kago
      label: 笼女
      gpt-path: GPT_weights_v2Pro/kago-e10.ckpt
      sovits-path: SoVITS_weights_v5turbo/kago_e2_s2414_l32.pth
      ref-audio: reference/Kago_ref.wav
      prompt-text: これはもはや、実行力のある結界、と言って良いでしょう。
      prompt-lang: ja
      text-lang: ja

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-name: ${MINIO_BUCKET:qq-chat-files}
  secure: false

# FFmpeg配置
ffmpeg:
  path: ${FFMPEG_PATH:D:/ai/Documents/qq-web/GPT-SoVITS-v5/runtime/ffmpeg.exe}

# Python 配置（用于 QQ SILK 语音解码）
python:
  executable: ${PYTHON_EXECUTABLE:C:/Users/46142/AppData/Roaming/uv/tools/astrbot/Scripts/python.exe}
  silk-script: ${PYTHON_SILK_SCRIPT:./scripts/convert_silk_to_mp3.py}

# 文件上传配置
file:
  upload:
    max-size: 100MB
    # 上传类型白名单（UploadTypePolicy 执行）：支持 image/* video/* audio/* 通配与 .pdf 这类单扩展名。
    # 不在白名单内的扩展名一律 400；文件的 Content-Type 由扩展名推导，不采信客户端声明的 MIME。
    # 留空 = 不限制类型。
    allowed-types: image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip
  # 媒体下载体积上限(从 QQ/NapCat 拉取媒体时生效)
  download:
    max-size-mb: ${FILE_DOWNLOAD_MAX_MB:100}
    max-video-size-mb: ${FILE_DOWNLOAD_MAX_VIDEO_MB:300}
  storage:
    temp-path: ./uploads/temp
    archive-path: ./uploads/archive
    local-path: ./uploads/images
  # 媒体保留策略：超过 days 天的媒体文件由定时任务自动清理
  # **默认关闭**（enabled=false）。开关与天数可在「后台 → 数据维护 → 媒体管理」修改，
  # 保存后落盘到 data/application-override.properties，重启后仍生效、改完立即生效。
  # 年龄口径：按文件「修改时间」计算，与媒体管理列表的时间筛选保持同一口径。
  retention:
    enabled: ${FILE_RETENTION_ENABLED:false}
    days: ${FILE_RETENTION_DAYS:90}
    # 参与自动清理的类型（逗号分隔）。刻意不含 FILE：pdf/zip/doc 不纳入自动删除。
    types: "${FILE_RETENTION_TYPES:IMAGE,VIDEO,AUDIO}"
    # 定时清理 cron（必须 6 段含秒）。默认每天 4:00，避开 2:00 归档/订阅过期、3:00 归档清理。
    # 该 cron 只在启动时注册，故只走配置，不在管理端暴露。
    cron: "${FILE_RETENTION_CRON:0 0 4 * * ?}"

# 消息归档配置
archive:
  days-before: 90
  cron: 0 0 2 * * ?

# JWT配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 注册与账户安全配置
# 出站 HTTP 超时（毫秒）。所有出站调用都必须有超时：下游卡死时无超时的客户端会永久占用调用线程，
# 并发一高就把 Tomcat 线程池占满、整个服务无响应。
app:
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:10000}     # 连接超时
    response-timeout-ms: ${HTTP_RESPONSE_TIMEOUT_MS:60000}   # 轻量内部调用（NapCat 等）读取超时
    long-timeout-ms: ${HTTP_LONG_TIMEOUT_MS:300000}          # 大模型 / 语音合成等长耗时调用的读取超时
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:true}
    rate-limit-per-ip: 5
    rate-limit-window-minutes: 1
  cors:
    # 逗号分隔的跨域白名单；可用环境变量 CORS_ALLOWED_ORIGINS 覆盖（不设时用下面这份本地默认值）。
    # 该值在 CorsConfig 里按逗号拆分，所以默认值里的逗号不会引起绑定问题。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176}
  cookie:
    # qqai_token Cookie 是否只在 HTTPS 下传输。本地 HTTP 开发保持 false；
    # **生产 HTTPS 部署必须设为 true**（环境变量 APP_COOKIE_SECURE=true），否则令牌会在明文 HTTP 上传输。
    secure: ${APP_COOKIE_SECURE:false}
  security:
    # 可信反向代理地址（逗号分隔，支持精确 IP 与 CIDR）。默认仅本机回环。
    # 只有 TCP 来源属于该列表时，才采信 X-Forwarded-For / X-Real-IP 作为客户端 IP；
    # 否则一律用 TCP 源地址——否则客户端伪造转发头即可绕过按 IP 的登录/注册限流。
    # 部署在 nginx / 网关之后时，把网关地址（如 172.17.0.0/16）加进来。
    trusted-proxies: "${TRUSTED_PROXIES:127.0.0.1,::1}"

# AI 摘要（阶段 1 单条按需 / 阶段 2 批量 / 阶段 3 群日报）
ai:
  summary:
    enabled: ${AI_SUMMARY_ENABLED:true}          # 总开关，关闭后摘要接口返回 403
    daily-limit: ${AI_SUMMARY_DAILY_LIMIT:300}   # 全站每日摘要条数上限（按 ai_summarized_at 统计）
    min-length: ${AI_SUMMARY_MIN_LENGTH:8}       # 参与摘要的最短内容长度
    max-input-chars: ${AI_SUMMARY_MAX_INPUT_CHARS:12000}  # 群日报拼接上限（两端保留）
    # 以下三项同属「后台 → 数据维护 → 摘要设置」的运行时配置：保存后立即生效，并落盘到
    # data/application-override.properties（重启后仍生效）。这里的值只是没有落盘覆盖时的默认值。
    group-whitelist: ${AI_SUMMARY_GROUP_WHITELIST:}   # 群白名单，逗号分隔；空 = 不限制
    # 定时日报 cron：必须 6 段含秒（如 0 50 23 * * ?）；留空 = 不启用定时任务（应用照常启动）
    digest-cron: ${AI_SUMMARY_DIGEST_CRON:}
    digest-groups: ${AI_SUMMARY_DIGEST_GROUPS:}       # 定时日报的群号，逗号分隔；空 = 今天有消息的群
  admin:
    init-password: ${ADMIN_INIT_PASSWORD:}
  debug:
    # 媒体事件抓包开关:true 时打印图片/视频事件的完整载荷(含聊天内容),仅排查媒体链路时临时开启
    # 媒体链路排查手册见 doc/MEDIA_TROUBLESHOOTING.md
    log-media-payload: ${APP_DEBUG_LOG_MEDIA_PAYLOAD:false}


# 组件插件化描述符：启动命令/端口/探测/顺序，默认值与改造前一致
component:
  health-interval-ms: ${COMPONENT_HEALTH_INTERVAL_MS:5000}
  state-file: ${COMPONENT_STATE_FILE:data/components-state.json}
  components:
    - id: napcat
      legacy-key: napcat
      display-name: NapCat
      capability: im
      launch-mode: DETACHED_LAUNCHER
      command: [cmd.exe, /c, launcher.bat]
      workdir: ${NAPCAT_HOME:../../napcat/NapCat.Shell}
      ports: [6099, 6100]
      probe: { type: tcp, port: 6099, timeout-ms: 1000 }
      startup-timeout-ms: 120000
      stop-strategy: PROCESS_NAMES
      process-names: [NapCatWinBootMain, QQ]
      adopt-external: true
      order: 10
      web-ui: ${NAPCAT_WEBUI_URL:http://127.0.0.1:6099/webui}
    - id: astrbot
      legacy-key: astrbot
      display-name: AstrBot
      capability: chat
      launch-mode: SUPERVISED
      command: [cmd.exe, /c, astrbot, run]
      workdir: ${ASTRBOT_HOME:../../Astrbot}
      ports: [6185]
      probe: { type: tcp, port: 6185, timeout-ms: 1000 }
      startup-timeout-ms: 90000
      stop-strategy: PROCESS_TREE
      adopt-external: true
      order: 20
      web-ui: ${ASTRBOT_API_URL:http://127.0.0.1:6185}
    - id: gpt-sovits
      legacy-key: gptsovits
      display-name: GPT-SoVITS
      capability: tts
      launch-mode: SUPERVISED
      command: ["${GPT_SOVITS_INSTALL_DIR:D:/ai/Documents/qq-web/GPT-SoVITS-v5}/runtime/python.exe", api_v2.py, -c, "${GPT_SOVITS_INFER_CONFIG:GPT_SoVITS/configs/tts_infer_v5turbo.yaml}", -a, 127.0.0.1, -p, 8000]
      workdir: ${GPT_SOVITS_INSTALL_DIR:D:/ai/Documents/qq-web/GPT-SoVITS-v5}
      ports: [8000]
      probe: { type: tcp, port: 8000, timeout-ms: 1000 }
      startup-timeout-ms: 300000
      stop-strategy: PROCESS_TREE
      adopt-external: true
      order: 30
      web-ui: http://localhost:9874

# 多机器人（每个用户自己的 QQ 机器人）
bot:
  enabled: ${BOT_ENABLED:true}
  seed-default: ${BOT_SEED_DEFAULT:true}
  default-owner: ${BOT_DEFAULT_OWNER:}
  default-qq: ${BOT_DEFAULT_QQ:2488130337}
  default-name: ${BOT_DEFAULT_NAME:默认机器人}
  default-napcat-port: ${BOT_DEFAULT_NAPCAT_PORT:6099}
  default-onebot-port: ${BOT_DEFAULT_ONEBOT_PORT:6100}
  default-workdir: ${BOT_DEFAULT_WORKDIR:../../napcat/NapCat.Shell}
  port-range-start: ${BOT_PORT_RANGE_START:16100}
  max-per-user: ${BOT_MAX_PER_USER:1}
  workdir-root: ${BOT_WORKDIR_ROOT:bots}

---
# Dev profile: 开发环境覆盖
# 启用: java -jar app.jar --spring.profiles.active=dev
# 或:   mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 开发环境直接指定（避免环境变量未设置时启动失败）
    url: jdbc:mysql://localhost:3306/qq_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  # 「记住我」勾选后的有效期：默认 30 天
  remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:2592000000}

napcat:
  token: ${NAPCAT_TOKEN:}
  webhook-token: ${NAPCAT_WEBHOOK_TOKEN:}

minio:
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}

