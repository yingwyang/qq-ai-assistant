spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 用 create 而不是 create-drop：H2 是**共享命名库**（mem:testdb + DB_CLOSE_DELAY=-1），
      # 而 create-drop 会在「上下文关闭」时 drop 掉整个 schema——被 drop 的可能是另一个仍在
      # Spring 上下文缓存里、稍后会被复用的上下文正在用的表，表现为
      # 「Table "USERS" not found (this database is empty)」这类偶发失败
      # （2026-10-15 全量 mvn test 在 SecurityHardeningTest.setUp 上就是这么挂的，单独跑却全绿）。
      # create 只在上下文**启动**时重建 schema，不再在关闭时删，跨上下文互踩即消失。
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long-for-jwt-signing
  expiration: 86400000

napcat:
  self-qq: "123456"
  api-url: http://127.0.0.1:3000
  token: test-napcat-token
  webhook-token: test-webhook-token
  webui-url: http://127.0.0.1:6099

minio:
  endpoint: http://127.0.0.1:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket-name: test-bucket

astrbot:
  api-url: http://127.0.0.1:6185
  token: test-astrbot-token
  data-path: ./target/test-astrbot-data

gpt-sovits:
  api-url: http://127.0.0.1:5000
  token: test-gpt-sovits-token
  ref-audio-path: ./target/test-ref.wav
  prompt-text: test prompt
  prompt-lang: zh
  text-lang: zh
  output-dir: ./target/test-gpt-sovits-output

file:
  storage:
    local-path: ./target/test-uploads/images
    archive-path: ./target/test-uploads/archive
  purge:
    base-dir: ./target/test-uploads
  # 与主配置保持一致：上传类型白名单必须真实生效，否则测试环境会漏掉这层校验
  upload:
    max-size: 100MB
    allowed-types: image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip

app:
  plugin:
    dir: ./target/test-plugins

archive:
  days-before: 90
  cron: "0 0 2 * * ?"

# 测试用的 Actuator 配置：与生产一致地打开详情（该端点已收权为 ADMIN），
# 便于 ActuatorHealthSecurityTest 断言 db 组件探测存在。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

component:
  # 测试环境不启动真实组件，状态文件隔离到 target，避免污染 backend/data
  state-file: ./target/test-components-state.json
  components: []

logging:
  file:
    name: ./target/test-logs/application.log
  level:
    root: WARN
    com.qqai: INFO

# 测试环境不种子默认机器人（避免每个测试上下文都建 bots 记录）
bot:
  seed-default: false
